server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: record-of-work
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:record_of_work}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=utf8mb4&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Avi6855#}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    date-format: dd-MM-yyyy HH:mm:ss
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:ZnVsbHN0YWNrYXBwbGljYXRpb25rZXlmb3Jqd3R0b2tlbjIwMjRrZXk=}
  access-token-expiration: 86400000  # 24 hours
  refresh-token-expiration: 604800000  # 7 days

# File Storage
file:
  upload:
    directory: ${FILE_UPLOAD_DIR:./uploads}
    max-size: 10MB

# Logging
logging:
  level:
    com.recordofwork: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# CORS
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
